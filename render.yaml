services:
  - type: web
    name: hiver-support-agent
    runtime: python
    # requirements-web.txt, not requirements.txt: the serving path never imports
    # torch / sentence-transformers / sklearn / pandas, and leaving them out keeps the
    # process under the 512 MB free-tier limit and shortens container start.
    buildCommand: pip install -r requirements-web.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.11"
